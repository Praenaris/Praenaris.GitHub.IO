# Social networks and contact channels, keyed by the suffix of their CSS classes
# (pr-social-item-<key>, pr-contact-item-<key>).
# icon: the network's logo, used as a CSS mask, so only its shape matters and the colour comes from the CSS.
#       Prefer an SVG, otherwise a PNG with a transparent background. They live in /img/socials/.
# external: true for links to outside websites, false for anything else (email).
# Only external ones are shown in the home page's hero.

applemusic:
  name: "Apple Music"
  icon: "/img/socials/applemusic.png"
  external: true

